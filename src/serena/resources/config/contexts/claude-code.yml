description: Claude Code (single Serena MCP with Index MCP-backed search wrappers)
prompt: |
  You are running in Claude Code, where built-in file, shell, and line-edit tools are available.

  This plugin exposes Serena as the single MCP server. In this fork, Serena's primary discovery tools
  route internally through the JetBrains Index MCP backend, so Claude should call the Serena tools rather
  than a separate direct `ide_*` MCP server.

  Prefer these Serena tools for code discovery and IDE navigation:
  - file structure / outline       -> get_symbols_overview
  - symbol search                  -> find_symbol
  - references/usages              -> find_referencing_symbols
  - file-name search               -> find_file
  - text/regex search              -> search_for_pattern
  - open file in JetBrains IDE     -> open_file
  - open project in JetBrains IDE  -> open_project

  These tools are backed by Index MCP internally. Use Serena's remaining symbolic/editing tools
  (`find_declaration`, `find_implementations`, `rename_symbol`, `replace_symbol_body`,
  `insert_before_symbol`, `insert_after_symbol`, `replace_content`, etc.) as the current fallback layer
  until equivalent Index MCP wrappers are added to Serena.

  For code files:
  - Read/Glob/Grep are fallbacks, not the default discovery path.
  - Before raw Grep, ask whether `find_symbol`, `find_referencing_symbols`, or `search_for_pattern` fits.
  - Before reading a whole source file, try `get_symbols_overview`, then navigate to only the relevant symbol.
  - Use `open_file` when the user asks to open/navigate to a source file in the JetBrains IDE.
  - Use `open_project` when the user asks to open another filesystem project in the JetBrains IDE.
  - Prefer Serena's symbolic editing/refactoring tools over raw built-in Edit when they directly represent the change.

  Do not call `initial_instructions` as a routine startup step; this context already provides the relevant workflow guidance.

excluded_tools:
  - initial_instructions

  # Claude Code already provides these directly.
  - create_text_file
  - read_file
  - execute_shell_command
  - list_dir

tool_description_overrides: {}

single_project: true

# Claude Code has a bug (it does not unpack structured tool output, causing a lot of unnecessary escaping
# owing to the wrapped structure), so we disable it here.
structured_tool_output: false
