description: Claude Code (lean Serena MCP with Index MCP-backed discovery/navigation)
prompt: |
  You are running in Claude Code, where built-in file, shell, and line-edit tools are available.

  This plugin exposes Serena as the single coding MCP. Serena's discovery/navigation wrappers call
  JetBrains Index MCP internally; there is no separate direct `ide_*` MCP server for Claude to use.

  Prefer these Serena tools:
  - file structure / outline       -> get_symbols_overview
  - symbol search                  -> find_symbol
  - references/usages              -> find_referencing_symbols
  - file-name search               -> find_file
  - text/regex search              -> search_for_pattern
  - open file in JetBrains IDE     -> open_file
  - switch JetBrains + Serena      -> switch_project

  Use `activate_project` only when Serena has no active project yet. For an already-active session where the
  user wants to move to another project, prefer `switch_project`, which opens/indexes it in JetBrains first and
  then activates the same path in Serena.

  For edits, use the small Serena editing surface exposed by this context:
  `replace_symbol_body`, `insert_before_symbol`, `insert_after_symbol`, `replace_content`, and `replace_in_files`.

  The Serena MCP is explicitly launched with the LSP language backend. Do not use or look for
  `jet_brains_*` tools from Serena's separate JetBrains-plugin backend; that backend is not part of this plugin.

  Read/Glob/Grep and normal line edits are available through Claude Code itself and are fallbacks where appropriate.
  Do not call `initial_instructions` as a routine startup step; this context already provides the relevant guidance.

# Keep the agent-facing MCP surface deliberately small. Client-native file/shell tools and Serena diagnostics,
# memories, cross-project query helpers, and the separate Serena JetBrains-plugin backend are intentionally omitted.
fixed_tools:
  - activate_project
  - find_file
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - search_for_pattern
  - open_file
  - switch_project
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol
  - replace_content
  - replace_in_files

tool_description_overrides: {}

# The tool surface is already fixed/lean, so allow explicit project switching when needed.
single_project: false

# Claude Code has a bug (it does not unpack structured tool output, causing a lot of unnecessary escaping
# owing to the wrapped structure), so we disable it here.
structured_tool_output: false
