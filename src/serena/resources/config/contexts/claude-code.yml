description: Claude Code (Index MCP for code intelligence, Serena for complementary editing/project workflows)
prompt: |
  You are running in Claude Code, where built-in file, shell, and line-edit tools are available.

  For code discovery and navigation, Index MCP is the PRIMARY layer. Its `ide_*` tools use the
  JetBrains project index/PSI and should be preferred over raw Read/Glob/Grep whenever they can
  answer the question semantically.

  Prefer these Index MCP tools:
  - file structure / outline       -> ide_file_structure
  - symbol search                  -> ide_find_symbol
  - exact declaration/definition   -> ide_find_definition
  - references/usages              -> ide_find_references
  - file-name search               -> ide_find_file
  - text/regex search              -> ide_search_text
  - signature/docs at a position   -> ide_symbol_info
  - implementations                -> ide_find_implementations
  - caller/callee relationships    -> ide_call_hierarchy
  - type inheritance               -> ide_type_hierarchy

  Use Serena for complementary editing/refactoring/project workflows when an Index MCP edit tool
  does not fit. Index MCP refactoring/editing tools (for example `ide_refactor_rename`,
  `ide_replace_text_in_file`, `ide_edit_member`, `ide_replace_member`, `ide_insert_member`) should
  be preferred when enabled and applicable because the IDE updates PSI/index state immediately.

  For code files:
  - Read/Glob/Grep are fallbacks, not the default discovery path.
  - Before raw Grep, ask whether `ide_find_symbol`, `ide_find_references`, or `ide_search_text` fits.
  - Before reading a whole source file, try `ide_file_structure`, then navigate to only the relevant definition.
  - Before a rename or structural refactor, prefer the corresponding Index MCP refactoring tool.
  - If Index MCP cannot express the edit or the language/tool is unsupported, use Serena's editing tools.

  Do not fall back to raw tools merely because the path is known or because one raw call appears shorter.
  Fall back when Index MCP is unavailable, the target is not indexed/parseable, or the task genuinely needs raw text.

  This Claude Code integration already provides the relevant Serena/Index MCP workflow guidance.
  Do not call `initial_instructions` as a routine startup step.

excluded_tools:
  - initial_instructions

  # Claude built-ins or direct Index MCP equivalents
  - create_text_file
  - read_file
  - execute_shell_command
  - list_dir
  - find_file
  - search_for_pattern

  # Index MCP code-intelligence equivalents
  - find_symbol
  - get_symbols_overview
  - find_referencing_symbols
  - find_declaration
  - find_implementations

  # Index MCP refactor/member-edit equivalents
  - rename_symbol
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol

tool_description_overrides: {}

single_project: true

# Claude Code has a bug (it does not unpack structured tool output, causing a lot of unnecessary escaping
# owing to the wrapped structure), so we disable it here.
structured_tool_output: false
