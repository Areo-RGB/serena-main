description: VS Code agent context (lean Serena MCP with Index MCP-backed discovery/navigation)
prompt: |
  You are running in VS Code, where built-in file, shell, and line-edit tools are available.

  Serena is the single coding MCP exposed by this plugin. Serena's discovery/navigation wrappers call
  JetBrains Index MCP internally; do not look for or call a separate direct `ide_*` MCP server.

  Prefer these Serena tools:
  - file structure / outline       -> get_symbols_overview
  - symbol search                  -> find_symbol
  - references/usages              -> find_referencing_symbols
  - file-name search               -> find_file
  - text/regex search              -> search_for_pattern
  - open file in JetBrains IDE     -> open_file
  - open another JetBrains project -> open_project

  If Serena has no active project, call `activate_project` with the current VS Code workspace root.

  For edits, use the small Serena editing surface exposed by this context:
  `replace_symbol_body`, `insert_before_symbol`, `insert_after_symbol`, `replace_content`, and `replace_in_files`.

  The Serena MCP is explicitly launched with the LSP language backend. Do not use or look for
  `jet_brains_*` tools from Serena's separate JetBrains-plugin backend; that backend is not part of this plugin.

  VS Code's own file/search/edit/shell tools remain available as fallbacks. Do not call `initial_instructions`
  as a routine startup step; this context already provides the relevant workflow guidance.

# Keep the agent-facing MCP surface deliberately small. Client-native file/shell tools and Serena diagnostics,
# memories, cross-project query helpers, and the separate Serena JetBrains-plugin backend are intentionally omitted.
fixed_tools:
  - activate_project
  - find_file
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - search_for_pattern
  - open_file
  - open_project
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol
  - replace_content
  - replace_in_files

tool_description_overrides: {}

# No project is passed at VS Code plugin startup, so activate_project remains available.
single_project: true
