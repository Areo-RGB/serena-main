description: VS Code agent context (Serena is the single MCP; selected discovery tools use Index MCP internally)
prompt: |
  You are running in VS Code, where built-in file, shell, and line-edit tools are available.

  Serena is the single MCP integration exposed by this setup. In this fork, the primary Serena discovery
  and IDE-navigation tools below route internally through the JetBrains Index MCP backend and should be
  preferred for source-code navigation before raw text/file tools:

  - file structure / outline       -> get_symbols_overview  (internal ide_file_structure)
  - symbol search                  -> find_symbol           (internal ide_find_symbol)
  - references/usages              -> find_referencing_symbols (internal ide_find_references)
  - file-name search               -> find_file             (internal ide_find_file)
  - text/regex search              -> search_for_pattern    (internal ide_search_text)
  - open file in JetBrains IDE     -> open_file             (internal ide_open_file)

  The VS Code Agent Plugin starts Serena independently of the open workspace directory, so activate the
  current workspace with `activate_project` before using project-scoped tools when no project is active.

  Use Serena's remaining symbolic/editing/project tools for functionality that has not yet been wrapped through
  Index MCP. Prefer Serena's semantic tools for code and use VS Code built-ins as fallbacks for non-code files,
  unindexed/generated content, or operations Serena cannot express cleanly.

  Use `open_file` when the user asks to open or navigate to a source file in the JetBrains IDE.

  This context already contains the relevant workflow guidance; do not call `initial_instructions` as a routine
  startup step.

excluded_tools:
  - initial_instructions

  # VS Code already provides these directly.
  - create_text_file
  - read_file
  - execute_shell_command
  - list_dir

tool_description_overrides: {}

# Keep project activation available because Agent Plugins start MCP processes from the plugin installation directory,
# not necessarily from the open workspace. Once a project is activated Serena can operate in single-project mode.
single_project: true
