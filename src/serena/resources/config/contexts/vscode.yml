description: VS Code agent context (lean Serena MCP with Code Intelligence MCP-backed semantic reads)
prompt: |
  You are running in VS Code, where built-in file, shell, search, edit, and navigation tools are available.

  Serena is the single coding MCP exposed by this plugin. Serena uses the small Code Intelligence MCP
  (`intellij-mcp`) service inside JetBrains for semantic code reads. Do not look for or call a separate
  direct IntelliJ/Index MCP server.

  Prefer these Serena semantic tools for indexed source code:
  - file structure / outline       -> get_symbols_overview  (internal get_file_symbols)
  - symbol search                  -> find_symbol           (internal find_symbol)
  - references/usages              -> find_referencing_symbols (internal find_references)
  - symbol type/docs/signature     -> get_symbol_info       (internal get_symbol_info)
  - inheritance hierarchy          -> get_type_hierarchy    (internal get_type_hierarchy)

  Use VS Code's native file-name search, text/regex search, file reads, navigation, and shell tools.
  Do not look for Serena wrappers for file search, text search, opening files, or opening projects.

  If Serena has no active project or is on the wrong one, call `activate_project` with the current workspace root.
  The corresponding project must already be open in JetBrains for Code Intelligence MCP semantic calls to work.

  For edits, use the small Serena/LSP editing surface exposed by this context:
  `replace_symbol_body`, `insert_before_symbol`, `insert_after_symbol`, `replace_content`, and `replace_in_files`.

  Serena is explicitly launched with the LSP language backend for its native editing functionality. Do not use
  or look for `jet_brains_*` tools from Serena's separate JetBrains-plugin backend.

  Do not call `initial_instructions` as a routine startup step; this context already provides the relevant guidance.

# Deliberately small agent-facing MCP surface. Client-native file/search/shell/navigation tools, Serena diagnostics,
# memories, cross-project query helpers, and the separate Serena JetBrains-plugin backend are omitted.
fixed_tools:
  - activate_project
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - get_symbol_info
  - get_type_hierarchy
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol
  - replace_content
  - replace_in_files

tool_description_overrides: {}
single_project: false
