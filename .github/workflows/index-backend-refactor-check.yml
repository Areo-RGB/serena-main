name: index-backend-refactor-check
on:
  push:
    branches:
      - refactor/index-mcp-backend
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run python -m compileall -q src
      - run: uv run pytest -q test/serena --maxfail=1
