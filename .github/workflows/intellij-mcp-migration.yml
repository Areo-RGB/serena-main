name: migrate-to-intellij-mcp
on:
  push:
    branches:
      - refactor/intellij-mcp-backend

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/intellij-mcp-backend
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Make embedded replacement strings raw
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/migrate_intellij_backend.py')
          s = p.read_text()
          for name in ('GetSymbolsOverviewTool', 'FindSymbolTool', 'FindReferencingSymbolsTool'):
              s = s.replace(f'replace_class(symbol, "{name}", \'\'\'', f'replace_class(symbol, "{name}", r\'\'\'')
          p.write_text(s)
          PY
      - run: python scripts/migrate_intellij_backend.py
      - run: uv sync --extra dev
      - name: Validate Python
        run: |
          uv run python -m compileall -q src
          uv run ruff check --fix \
            src/serena/intellij_mcp_client.py \
            src/serena/tools/intellij_mcp_tools.py \
            src/serena/tools/symbol_tools.py \
            src/serena/tools/file_tools.py \
            src/serena/tools/__init__.py
          uv run python -m compileall -q src
      - name: Remove migration scaffolding and commit
        run: |
          rm -f scripts/migrate_intellij_backend.py .github/workflows/intellij-mcp-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: replace Index MCP with Code Intelligence MCP"
          git push origin HEAD:refactor/intellij-mcp-backend
