name: validate-intellij-mcp-backend
on:
  push:
    branches:
      - refactor/intellij-mcp-backend

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/intellij-mcp-backend
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Apply final prompt and hook cleanup
        run: python scripts/finalize_intellij_mcp_cleanup.py
      - run: uv sync --extra dev
      - name: Compile and lint
        run: |
          uv run python -m compileall -q src
          uv run ruff check --ignore B006 \
            src/serena/intellij_mcp_client.py \
            src/serena/tools/intellij_mcp_tools.py \
            src/serena/tools/symbol_tools.py \
            src/serena/tools/file_tools.py \
            src/serena/tools/__init__.py \
            src/serena/hooks.py
      - name: Registry and lean-context checks
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml
          from serena.tools import ToolRegistry

          expected = [
              "activate_project",
              "get_symbols_overview",
              "find_symbol",
              "find_referencing_symbols",
              "get_symbol_info",
              "get_type_hierarchy",
              "replace_symbol_body",
              "insert_before_symbol",
              "insert_after_symbol",
              "replace_content",
              "replace_in_files",
          ]
          names = set(ToolRegistry().get_tool_names())
          assert {"get_symbol_info", "get_type_hierarchy"} <= names
          for context in ("claude-code", "vscode"):
              path = Path(f"src/serena/resources/config/contexts/{context}.yml")
              data = yaml.safe_load(path.read_text())
              assert data["fixed_tools"] == expected, (context, data["fixed_tools"])
          assert not Path("src/serena/index_mcp_client.py").exists()
          assert not Path("src/serena/tools/index_mcp_ui_tools.py").exists()
          print("registry/context checks passed")
          PY
      - name: Hook classifier check
        run: |
          uv run python - <<'PY'
          from serena.hooks import _is_semantic_code_tool_name

          positive = [
              "find_symbol",
              "mcp__serena-index__find_symbol",
              "get_symbols_overview",
              "find_referencing_symbols",
              "get_symbol_info",
              "get_type_hierarchy",
          ]
          negative = ["grep", "read_file", "find_file", "search_for_pattern", "replace_content"]
          assert all(_is_semantic_code_tool_name(name) for name in positive)
          assert not any(_is_semantic_code_tool_name(name) for name in negative)
          print("hook semantic-tool classifier passed")
          PY
      - name: Mock Code Intelligence MCP transport
        run: |
          uv run python - <<'PY'
          import json
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          from serena.intellij_mcp_client import IntellijMcpClient
          from serena.tools.intellij_mcp_tools import _normalise_location

          seen = {}
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers["Content-Length"]))
                  request = json.loads(body)
                  seen.update(request)
                  result_text = json.dumps([{"name": "Foo", "kind": "CLASS"}])
                  envelope = {
                      "jsonrpc": "2.0",
                      "id": request["id"],
                      "result": {"content": [{"type": "text", "text": result_text}]},
                  }
                  payload = json.dumps(envelope).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)
              def log_message(self, *_args):
                  pass

          server = HTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          project = "/tmp/serena-intellij-test"
          client = IntellijMcpClient(project, url=f"http://127.0.0.1:{server.server_port}/mcp")
          result = client.call_tool("find_symbol", {"name": "Foo"})
          server.shutdown()
          thread.join(timeout=2)

          assert result == [{"name": "Foo", "kind": "CLASS"}]
          assert seen["method"] == "tools/call"
          assert seen["params"]["name"] == "find_symbol"
          assert seen["params"]["arguments"]["projectPath"] == str(Path(project).resolve())

          location = _normalise_location(client, {
              "filePath": f"{project}/src/foo.py",
              "line": 34,
              "column": 5,
              "endLine": 36,
              "endColumn": 9,
              "preview": "class Foo:",
          })
          assert location == {
              "relative_path": "src/foo.py",
              "line": 33,
              "column": 4,
              "end_line": 35,
              "end_column": 8,
              "preview": "class Foo:",
          }
          print("mock transport/coordinate checks passed")
          PY
      - name: No old Index MCP runtime or plugin guidance
        run: |
          ! grep -R --exclude='*.pyc' --exclude-dir='__pycache__' \
            "SERENA_INDEX_MCP\|29170\|ide_find_symbol\|ide_file_structure\|ide_find_references\|ide_find_file\|ide_search_text\|Index MCP" \
            src/serena/hooks.py \
            src/serena/resources/config/contexts/claude-code.yml \
            src/serena/resources/config/contexts/vscode.yml \
            src/serena/resources/config/prompt_templates/system_prompt.yml \
            src/serena/resources/config/modes/editing.yml \
            plugins/serena-index-mcp \
            INTELLIJ_MCP_BACKEND.md
      - name: Commit finalized migration and remove temporary scaffolding
        run: |
          rm -f scripts/finalize_intellij_mcp_cleanup.py .github/workflows/intellij-mcp-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finalize Code Intelligence MCP backend"
          git push origin HEAD:refactor/intellij-mcp-backend
